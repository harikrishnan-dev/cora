databases:
  - name: cora-db
    databaseName: cora
    user: cora
    plan: starter

services:
  - type: web
    name: cora
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cora-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: API_URL
        value: http://localhost:8000
      - key: API_PORT
        value: "8000"
